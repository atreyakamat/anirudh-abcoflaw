name: AB & Co. Legal Platform CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Build, Security & Quality Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Security Vulnerability Audit
        run: npm audit --audit-level=high || true

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run Backend & Frontend Typechecks
        run: npm run typecheck

      - name: Run ESLint Code Quality Inspection
        run: npm run lint

      - name: Run Backend Unit & Integration Tests
        run: npm test

      - name: Build NestJS Backend & Next.js Frontend
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright End-to-End Tests
        run: npm run test:e2e
