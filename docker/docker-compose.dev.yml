      - ../backend/src:/app/src:Z 
      - ../backend/prisma:/app/prisma:Z 
      - ../backend/uploads:/app/uploads:Z 
    depends_on:
      postgres
    networks:
      - law_practice_network

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend/Dockerfile.dev
    container_name: law_practice_crm_frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    volumes:
      - ../frontend/src:/app/src:Z 
      - ../frontend/public:/app/public:Z
    depends_on:
      - backend
    networks:
      - law_practice_network

  admin-dashboard:
    build:
      context: ../admin-dashboard
      dockerfile: ../docker/frontend/Dockerfile.dev
    container_name: law_practice_crm_admin_dashboard
    restart: unless-stopped
    ports:
      - '5173:5173'
    environment:
      - NODE_ENV=development
    command: npm run dev -- --host
    volumes:
      - ../admin-dashboard/src:/app/src:Z 
      - ../admin-dashboard/public:/app/public:Z
    depends_on:
      - backend
    networks:
      - law_practice_network

volumes:
  postgres_data:

networks:
  law_practice_network:
    driver: bridge
