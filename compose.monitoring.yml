version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: law_crm_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - law_crm_network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: law_crm_grafana
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - law_crm_network

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
