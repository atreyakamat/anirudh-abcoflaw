version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: law_crm_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-law_practice_crm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-law_practice_crm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - law_crm_network

  # Backend API (NestJS)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: law_crm_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    # IMPORTANT: Do NOT use .env.example in production.
    # Copy backend/.env.example to backend/.env, fill in all secrets, and
    # this service will automatically load backend/.env at runtime.
    # The env_file directive intentionally references .env (not .env.example).
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # Override DATABASE_URL to use the Docker internal hostname 'db' so the
      # backend container can reach Postgres without exposing it on the host.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@db:5432/${POSTGRES_DB:-law_practice_crm}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@db:5432/${POSTGRES_DB:-law_practice_crm}
      UPLOAD_DESTINATION: /app/uploads
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - law_crm_network

  # Frontend (Next.js)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # NEXT_PUBLIC_API_URL is baked into the Next.js bundle at build time and
        # used for client-side (browser) API calls. Set this to the public-facing
        # URL of the backend (e.g. https://api.yourdomain.com/api/v1).
        # Do NOT use http://localhost here — it will not resolve inside Docker
        # for server-side rendering. SSR uses BACKEND_URL (set below) instead.
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    container_name: law_crm_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # BACKEND_URL is used only by Next.js Server-Side Rendering to call the
      # backend over the Docker internal network. Never expose this to the browser.
      BACKEND_URL: http://backend:3001
      # Used by the API client for server-side rendering (SSR) to call the backend.
      NEXT_PUBLIC_API_URL_INTERNAL: http://backend:3001/api/v1
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - law_crm_network

volumes:
  postgres_data:
    driver: local
  uploads:
    driver: local

networks:
  law_crm_network:
    driver: bridge
