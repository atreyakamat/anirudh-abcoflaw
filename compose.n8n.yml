version: '3.8'

services:
  # n8n Intelligent Automation Layer
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: law_crm_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Kolkata
      - N8N_METRICS=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/n8n/workflows:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - law_crm_network

volumes:
  n8n_data:
    driver: local
